<script>
    'use strict';
    $(function(){
        $('.slideShow img:gt(0)').hide();
        setInterval(function(){
                    $('.slideShow :first-child').fadeOut(2000)
                            .next('img').fadeIn(2000)
                            .end().appendTo('.slideShow');},
                9000);
    });




    bizsearch.onkeyup = function (e) {
        e = e || event;
        var bizsearch = document.getElementById('bizsearch'),
                searchform = document.getElementById('search-form');

        if (e.keyCode === 13 && !e.ctrlKey) {
            searchform.submit();
            bizsearch.setAttribute('placeholder', "enter business type here");

        }
        return true;
    };
</script>
