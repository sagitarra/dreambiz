<script>
    'use strict';

   /*this resizes the images in the slide show so they always fit the page - it doesn't center but hey...it's art!  */
    $(window).load(function() {
        /*instantiate variables  */
        var theWindow = $(window),
                $bg   = $("#bg"),
                aspectRatio  = $bg.width() / $bg.height();
         /*create the function  */
        function resizeBg() {
            if ( (theWindow.width() / theWindow.height()) < aspectRatio ) {
                $bg.removeClass().addClass('bgheight');
            } else {
                $bg.removeClass().addClass('bgwidth');
            }

        }
         /*call the resize function whenever the window resizes*/
        theWindow.resize(resizeBg).trigger("resize");

    });
    /*this runs the slide show on the front page */
    function fader() {
        $("img").first().appendTo('.slideshow').fadeOut(8400);
        $("img").first().fadeIn(8400);
        setTimeout(fader, 11480);
    }

   /*this submits the business type chosen by the user when the user presses the enter button and releases it*/
    bizsearch.onkeyup = function (e) {
        e = e || event;
        var bizsearch = document.getElementById('bizsearch'),
                searchform = document.getElementById('search-form');

        if (e.keyCode === 13 && !e.ctrlKey) {
            searchform.submit();
            bizsearch.setAttribute('placeholder', "enter business type here");

        }
        return true;
    };
</script>
